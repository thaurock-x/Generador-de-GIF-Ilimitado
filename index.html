<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de GIF Rápido</title>
  <style>
    :root {
      --primary: #2e7d32;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #e0e0e0;
      --text: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin: auto 0;
    }

    .header { text-align: center; margin-bottom: 15px; }
    .header h2 { color: var(--primary); font-size: 1.5rem; }
    .header p { color: #666; font-size: 0.85rem; margin-top: 4px; }

    .dropzone {
      border: 2px dashed #a5d6a7;
      background: #f1f8e9;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .dropzone input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    #loadingText {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      margin-top: 8px;
      font-weight: 600;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 8px;
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
    }

    .thumb-item {
      position: relative;
      width: 100%;
      height: 75px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #eee;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-item .remove-btn {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .form-group { display: flex; flex-direction: column; }
    label { font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }

    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      background: #fff;
    }

    .btn-main {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-main:disabled { background: #ccc; cursor: not-allowed; }

    .status-container { margin-top: 15px; display: none; }
    .progress-bar-wrap {
      background: #e0e0e0;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.1s linear;
    }

    .status-text { text-align: center; font-size: 0.8rem; color: #666; }

    .result-box {
      margin-top: 15px;
      text-align: center;
      padding-top: 15px;
      border-top: 1px dashed var(--border);
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }

    .btn-download {
      background: #0288d1;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      font-size: 0.9rem;
    }

      text-align: center;
      padding: 15px 0 5
