<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de GIF Ultra Estable</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #e0e0e0;
      --text: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 15px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header { text-align: center; margin-bottom: 15px; }
    .header h2 { color: var(--primary); font-size: 1.5rem; }
    .header p { color: #666; font-size: 0.85rem; margin-top: 4px; }

    .dropzone {
      border: 2px dashed #a5d6a7;
      background: #f1f8e9;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .dropzone input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 8px;
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
    }

    .thumb-item {
      position: relative;
      width: 100%;
      height: 75px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #eee;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-item .remove-btn {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .form-group { display: flex; flex-direction: column; }
    label { font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }

    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
    }

    .btn-main {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }

    .status-container { margin-top: 15px; display: none; }
    .progress-bar-wrap {
      background: #e0e0e0;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.1s;
    }

    .status-text { text-align: center; font-size: 0.8rem; color: #666; }

    .result-box {
      margin-top: 15px;
      text-align: center;
      padding-top: 15px;
      border-top: 1px dashed var(--border);
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }

    .btn-download {
      background: #0288d1;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>🎬 Generador de GIF Ultra Estable</h2>
    <p>Subida múltiple optimizada para móviles</p>
  </div>

  <div class="dropzone">
    <p>📁 <strong>Haz clic aquí</strong> para seleccionar múltiples imágenes</p>
    <input type="file" id="images" multiple accept="image/*">
  </div>

  <div class="preview-grid" id="previewGrid"></div>

  <div class="options-grid">
    <div class="form-group">
      <label for="resolution">Resolución (px)</label>
      <select id="resolution">
        <option value="250">250 x 250 (Ultrarrápida)</option>
        <option value="350" selected>350 x 350 (Recomendada)</option>
        <option value="500">500 x 500 (HD)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="speed">Tiempo por foto (seg)</label>
      <input type="number" id="speed" value="0.5" min="0.1" max="5" step="0.1">
    </div>
  </div>

  <button class="btn-main" id="generateBtn" onclick="generateGIF()">⚡ Generar GIF</button>

  <div class="status-container" id="statusContainer">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Procesando...</div>
  </div>

  <div id="preview"></div>
</div>

<!-- Usamos gif.js en lugar de gifshot para procesamiento directo en Canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<script>
  let imageFiles = []; 

  const fileInput = document.getElementById("images");
  const previewGrid = document.getElementById("previewGrid");

  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
    if (!files.length) return;

    files.forEach(file => {
      imageFiles.push({
        file: file,
        url: URL.createObjectURL(file) // Carga inmediata en memoria sin Base64
      });
    });

    fileInput.value = "";
    renderThumbnails();
  });

  function removeFile(index) {
    URL.revokeObjectURL(imageFiles[index].url);
    imageFiles.splice(index, 1);
    renderThumbnails();
  }

  function renderThumbnails() {
    previewGrid.innerHTML = "";
    imageFiles.forEach((item, index) => {
      const thumb = document.createElement("div");
      thumb.className = "thumb-item";
      thumb.innerHTML = `
        <img src="${item.url}" alt="Img ${index + 1}">
        <button class="remove-btn" onclick="removeFile(${index})">✕</button>
      `;
      previewGrid.appendChild(thumb);
    });
  }

  // Carga y dibuja de forma segura en un canvas antes de enviarlo al codificador
  function loadImageToCanvas(item, targetSize) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = targetSize;
        canvas.height = targetSize;
        const ctx = canvas.getContext("2d");

        // Recorte cuadrado proporcional centrado
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;

        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, targetSize, targetSize);
        resolve(canvas);
      };
      img.onerror = reject;
      img.src = item.url;
    });
  }

  async function generateGIF() {
    if (!imageFiles.length) {
      alert("Por favor, selecciona al menos una imagen.");
      return;
    }

    const size = parseInt(document.getElementById("resolution").value);
    const speed = parseFloat(document.getElementById("speed").value);
    const delay = Math.round(speed * 1000); // Milisegundos

    const generateBtn = document.getElementById("generateBtn");
    const statusContainer = document.getElementById("statusContainer");
    const progressBar = document.getElementById("progressBar");
    const statusText = document.getElementById("statusText");
    const previewDiv = document.getElementById("preview");

    generateBtn.disabled = true;
    generateBtn.textContent = "⏳ Generando...";
    statusContainer.style.display = "block";
    progressBar.style.width = "5%";
    statusText.textContent = "Procesando fotogramas...";
    previewDiv.innerHTML = "";

    try {
      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: size,
        height: size,
        workerScript: "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js"
      });

      for (let i = 0; i < imageFiles.length; i++) {
        const canvas = await loadImageToCanvas(imageFiles[i], size);
        gif.addFrame(canvas, { delay: delay, copy: true });
        
        const percent = Math.round(((i + 1) / imageFiles.length) * 50);
        progressBar.style.width = percent + "%";
        statusText.textContent = `Procesando imagen ${i + 1} de ${imageFiles.length}...`;
      }

      gif.on('progress', function (p) {
        const percent = 50 + Math.round(p * 50);
        progressBar.style.width = percent + "%";
        statusText.textContent = `Compilando GIF: ${percent}%`;
      });

      gif.on('finished', function (blob) {
        generateBtn.disabled = false;
        generateBtn.textContent = "⚡ Generar GIF";
        progressBar.style.width = "100%";
        statusText.textContent = "¡GIF creado exitosamente!";

        const gifUrl = URL.createObjectURL(blob);
        previewDiv.innerHTML = `
          <div class="result-box">
            <img src="${gifUrl}" alt="GIF Creado">
            <br>
            <a href="${gifUrl}" download="animacion.gif" class="btn-download">
              ⬇ Descargar GIF
            </a>
          </div>
        `;
      });

      gif.render();

    } catch (err) {
      generateBtn.disabled = false;
      generateBtn.textContent = "⚡ Generar GIF";
      statusContainer.style.display = "none";
      alert("Error inesperado al crear el GIF. Intenta con imágenes más livianas.");
    }
  }
</script>

</body>
</html>
