<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de GIF Pro</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-main: #333333;
      --text-muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 15px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .header h2 {
      color: var(--primary);
      font-size: 1.6rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed #a5d6a7;
      background: #f1f8e9;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .dropzone p {
      font-size: 0.95rem;
      color: #333;
    }

    .dropzone input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* Indicador de carga de archivos */
    #loadingFiles {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      margin-top: 8px;
      font-weight: 600;
    }

    /* Miniaturas */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 8px;
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
    }

    .thumb-item {
      position: relative;
      width: 100%;
      height: 75px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #eee;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-item .remove-btn {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Opciones */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }

    /* Botón */
    .btn-main {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }

    /* Estado */
    .status-container {
      margin-top: 15px;
      display: none;
    }

    .progress-bar-wrap {
      background: #e0e0e0;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.15s;
    }

    .status-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .result-box {
      margin-top: 15px;
      text-align: center;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }

    .btn-download {
      background: #0288d1;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>🎬 Generador de GIF</h2>
    <p>Selecciona tus imágenes y crea tu animación</p>
  </div>

  <!-- Zona de Carga -->
  <div class="dropzone" id="dropzone">
    <p>📁 <strong>Haz clic aquí</strong> o arrastra tus imágenes</p>
    <input type="file" id="images" multiple accept="image/*">
  </div>
  <div id="loadingFiles">Cargando imágenes...</div>

  <!-- Lista de Previsualización -->
  <div class="preview-grid" id="previewGrid"></div>

  <!-- Opciones -->
  <div class="options-grid">
    <div class="form-group">
      <label for="resolution">Resolución (px)</label>
      <select id="resolution">
        <option value="200">200 x 200 (Rápido)</option>
        <option value="300" selected>300 x 300 (Recomendado)</option>
        <option value="400">400 x 400 (Buena calidad)</option>
        <option value="500">500 x 500 (HD)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="speed">Tiempo por foto (seg)</label>
      <input type="number" id="speed" value="0.5" min="0.1" max="5" step="0.1">
    </div>
  </div>

  <button class="btn-main" id="generateBtn" onclick="generateGIF()">⚡ Generar GIF</button>

  <!-- Progreso -->
  <div class="status-container" id="statusContainer">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Iniciando...</div>
  </div>

  <!-- Resultado -->
  <div id="preview"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gifshot@0.3.2/build/gifshot.min.js"></script>

<script>
  let imageFiles = [];

  const fileInput = document.getElementById("images");
  const previewGrid = document.getElementById("previewGrid");
  const loadingFiles = document.getElementById("loadingFiles");

  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) {
      handleFiles(Array.from(e.target.files));
    }
  });

  async function handleFiles(files) {
    const validFiles = files.filter(f => f.type.startsWith('image/'));
    if (!validFiles.length) return;

    loadingFiles.style.display = "block";
    
    for (const file of validFiles) {
      const src = await readFileAsDataURL(file);
      imageFiles.push({ file, src });
    }
    
    fileInput.value = ""; 
    loadingFiles.style.display = "none";
    renderThumbnails();
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  function removeFile(index) {
    imageFiles.splice(index, 1);
    renderThumbnails();
  }

  function renderThumbnails() {
    previewGrid.innerHTML = "";
    imageFiles.forEach((item, index) => {
      const thumb = document.createElement("div");
      thumb.className = "thumb-item";
      thumb.innerHTML = `
        <img src="${item.src}" alt="Img ${index + 1}">
        <button class="remove-btn" onclick="removeFile(${index})">✕</button>
      `;
      previewGrid.appendChild(thumb);
    });
  }

  // Redimensiona cada imagen en Canvas para no saturar memoria RAM
  function processCanvasImage(dataUrl, size) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        // Ajuste proporcional centrado
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;

        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = dataUrl;
    });
  }

  async function generateGIF() {
    if (!imageFiles.length) {
      alert("Por favor, selecciona al menos una imagen.");
      return;
    }

    const size = parseInt(document.getElementById("resolution").value);
    const speed = parseFloat(document.getElementById("speed").value);
    const generateBtn = document.getElementById("generateBtn");
    const statusContainer = document.getElementById("statusContainer");
    const progressBar = document.getElementById("progressBar");
    const statusText = document.getElementById("statusText");
    const previewDiv = document.getElementById("preview");

    generateBtn.disabled = true;
    generateBtn.textContent = "⏳ Procesando...";
    statusContainer.style.display = "block";
    progressBar.style.width = "5%";
    statusText.textContent = "Preparando imágenes...";
    previewDiv.innerHTML = "";

    try {
      const processedImages = [];
      for (let i = 0; i < imageFiles.length; i++) {
        const resizedSrc = await processCanvasImage(imageFiles[i].src, size);
        processedImages.push(resizedSrc);
        const p = Math.round(((i + 1) / imageFiles.length) * 40);
        progressBar.style.width = p + "%";
        statusText.textContent = `Ajustando resolución: ${p}%`;
      }

      statusText.textContent = "Creando GIF...";

      gifshot.createGIF({
        images: processedImages,
        gifWidth: size,
        gifHeight: size,
        interval: speed,
        numWorkers: 2,
        progressCallback: (p) => {
          const percent = 40 + Math.round(p * 60);
          progressBar.style.width = percent + "%";
          statusText.textContent = `Compilando GIF: ${percent}%`;
        }
      }, function (obj) {
        generateBtn.disabled = false;
        generateBtn.textContent = "⚡ Generar GIF";

        if (!obj.error) {
          progressBar.style.width = "100%";
          statusText.textContent = "¡Listo!";
          previewDiv.innerHTML = `
            <div class="result-box">
              <img src="${obj.image}" alt="GIF Resultante">
              <br>
              <a href="${obj.image}" download="animacion.gif" class="btn-download">
                ⬇ Descargar GIF
              </a>
            </div>
          `;
        } else {
          statusContainer.style.display = "none";
          alert("No se pudo crear el GIF. Intenta con una resolución más baja (ej. 200x200).");
        }
      });

    } catch (e) {
      generateBtn.disabled = false;
      generateBtn.textContent = "⚡ Generar GIF";
      statusContainer.style.display = "none";
      alert("Ocurrió un error inesperado al procesar las imágenes.");
    }
  }
</script>

</body>
</html>
